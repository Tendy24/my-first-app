<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
        <h2>Login</h2>
        <form action="/login" method="POST">
            <p><input type="text" name="username" placeholder="Username" required style="width: 100%; padding: 8px;">
            </p>
            <p><input type="password" name="password" placeholder="Password" required
                    style="width: 100%; padding: 8px;"></p>
            <button type="submit"
                style="width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 4px;">Log
                In</button>
        </form>

        <hr style="margin: 20px 0;">

        <h2>Register New Account</h2>
        <form action="/register" method="POST">
            <p><input type="text" name="username" placeholder="Choose Username" required
                    style="width: 100%; padding: 8px;"></p>
            <p><input type="password" name="password" placeholder="Choose Password" required
                    style="width: 100%; padding: 8px;"></p>
            <button type="submit"
                style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px;">Register</button>
        </form>
    </div>
</body>

</html>
