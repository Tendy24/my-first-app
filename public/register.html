<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef6ff 0%, #f7f9fc 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
        }

        .register-shell {
            width: 100%;
            max-width: 500px;
        }

        .register-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.10);
            padding: 32px 28px;
        }

        .register-card h1 {
            margin: 0 0 8px;
            font-size: 2rem;
            color: #111827;
        }

        .register-card p {
            margin: 0 0 18px;
            color: #4b5563;
        }

        .register-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .register-form label {
            font-weight: 600;
            color: #374151;
        }

        .register-form input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .register-form button {
            margin-top: 8px;
            width: 100%;
            border: none;
            background: linear-gradient(90deg, #2563eb, #1d4ed8);
            color: white;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .register-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="register-shell">
        <div class="register-card">
            <h1>Create Your Account</h1>
            <p>Join today and access your personal dashboard, settings, and account tools.</p>

            <form class="register-form" action="/register" method="POST">
                <div>
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" placeholder="Choose a username" required>
                </div>

                <div>
                    <label for="fullName">Full name</label>
                    <input id="fullName" name="fullName" type="text" placeholder="Your full name">
                </div>

                <div>
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" required>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Choose a password" required>
                </div>

                <button type="submit">Create account</button>
            </form>

            <a class="register-link" href="/login">Already have an account? Log in</a>
        </div>
    </div>
</body>
</html>
